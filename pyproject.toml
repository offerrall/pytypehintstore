[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytypehintstore"
dynamic = ["version"]
description = "Rows of one validated dataclass, in memory, shadowed by a JSON file you can open and edit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Beltrán Offerrall" }]

dependencies = ["pytypehint==1.0.0"]
keywords = ["dataclasses", "json", "persistence", "schema", "store", "type-hints"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/offerrall/pytypehintstore"
Repository = "https://github.com/offerrall/pytypehintstore"
Changelog = "https://github.com/offerrall/pytypehintstore/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = ["mypy", "pytest"]

[tool.hatch.version]
path = "src/pytypehintstore/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pytypehintstore"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
